groups:
  - name: smart-home-alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (irate(process_cpu_usage{job!="prometheus"}[1m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU使用率过高"
          description: "{{ $labels.instance }} CPU使用率超过80%"

      - alert: HighMemoryUsage
        expr: (1 - (jvm_memory_max_bytes{area="heap"} - jvm_memory_used_bytes{area="heap"}) / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "{{ $labels.instance }} 堆内存使用率超过85%"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务宕机"
          description: "{{ $labels.job }} 服务已宕机"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "错误率过高"
          description: "{{ $labels.instance }} HTTP错误率超过10%"

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "响应时间过长"
          description: "{{ $labels.instance }} P95响应时间超过2秒"