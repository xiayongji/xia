server:
  port: 8085

spring:
  application:
    name: analytics-service

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  datasource:
    url: jdbc:mysql://localhost:3306/smarthome_analytics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    com.smarthome.analytics: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always