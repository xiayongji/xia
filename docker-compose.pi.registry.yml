version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-spring: &healthcheck-spring
  interval: 60s
  timeout: 15s
  retries: 5
  start_period: 120s

services:
  mariadb:
    image: mariadb:10.11
    container_name: smart-home-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "384M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=50
      - --innodb-buffer-pool-size=64M

  redis:
    image: redis:7.0-alpine
    container_name: smart-home-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "96M"
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smart-home-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.4
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "256M"

  eureka-server:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/eureka-server:pi-latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_EUREKA}
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      <<: *healthcheck-spring
      start_period: 120s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "192M"

  api-gateway:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/api-gateway:pi-latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_GATEWAY}
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "320M"
    depends_on:
      eureka-server:
        condition: service_healthy

  device-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/device-service:pi-latest
    container_name: device-service
    restart: unless-stopped
    ports:
      - "${DEVICE_SERVICE_PORT}:8081"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_DEVICE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "320M"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  scene-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/scene-service:pi-latest
    container_name: scene-service
    restart: unless-stopped
    ports:
      - "${SCENE_SERVICE_PORT}:8083"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_SCENE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "320M"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/edge-service:pi-latest
    container_name: edge-service
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "${EDGE_SERVICE_PORT}:8084"
      - "${EDGE_GRPC_PORT}:9094"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_EDGE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/analytics-service:pi-latest
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "${ANALYTICS_SERVICE_PORT}:8085"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_ANALYTICS}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: "640M"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  multimodal-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/multimodal-service:pi-latest
    container_name: multimodal-service
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "${MULTIMODAL_SERVICE_PORT}:8089"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_MULTIMODAL}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: smart-home-prometheus
    restart: unless-stopped
    profiles:
      - monitor
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smart-home-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "192M"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: smart-home-grafana
    restart: unless-stopped
    profiles:
      - monitor
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - smart-home-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "192M"
    depends_on:
      prometheus:
        condition: service_started

  frontend:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-smart-home}/smart-home/frontend:pi-latest
    container_name: smart-home-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "64M"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  smart-home-network:
    driver: bridge