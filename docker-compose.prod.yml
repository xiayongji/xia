version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-healthcheck-spring: &healthcheck-spring
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

services:
  mysql:
    image: mysql:8.0
    container_name: smart-home-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=256M

  redis:
    image: redis:7.0-alpine
    container_name: smart-home-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --appendonly yes

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smart-home-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  eureka-server:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EUREKA_PORT}:8761"
    networks:
      - smart-home-network
    environment:
      JAVA_OPTS: ${JAVA_OPTS_EUREKA}
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  api-gateway:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_GATEWAY}
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "640M"
        reservations:
          cpus: "0.5"
          memory: "384M"
    depends_on:
      eureka-server:
        condition: service_healthy

  device-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/device-service:latest
    container_name: device-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVICE_SERVICE_PORT}:8081"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_DEVICE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "640M"
        reservations:
          cpus: "0.5"
          memory: "384M"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scene-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/scene-service:latest
    container_name: scene-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCENE_SERVICE_PORT}:8083"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_SCENE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "640M"
        reservations:
          cpus: "0.5"
          memory: "384M"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/edge-service:latest
    container_name: edge-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_SERVICE_PORT}:8084"
      - "127.0.0.1:${EDGE_GRPC_PORT}:9094"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_EDGE}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "896M"
        reservations:
          cpus: "0.5"
          memory: "384M"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/analytics-service:latest
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANALYTICS_SERVICE_PORT}:8085"
    environment:
      JAVA_OPTS: ${JAVA_OPTS_ANALYTICS}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      <<: *healthcheck-spring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "1.2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: smart-home-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: smart-home-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/smart-home.json:ro
      - ./prometheus_datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    depends_on:
      prometheus:
        condition: service_healthy

  frontend:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/smart-home/frontend:latest
    container_name: smart-home-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - smart-home-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  smart-home-network:
    driver: bridge