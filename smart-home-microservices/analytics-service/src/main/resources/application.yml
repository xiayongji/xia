server:
  port: 8085

spring:
  application:
    name: analytics-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    config:
      enabled: false

  # MySQL 数据库配置 (使用Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_analytics?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# 数据分析配置
analytics:
  anomaly:
    threshold: 0.85
    window-size: 100
  behavior:
    clustering-enabled: true
    k-means-clusters: 6
  energy:
    high-usage-threshold: 1000.0

logging:
  level:
    com.smarthome.analytics: DEBUG
    org.springframework.web: INFO