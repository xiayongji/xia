server:
  port: 8084

spring:
  application:
    name: analytics-service
  
  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3307/smarthome_analytics?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # Redis 缓存配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    config:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

analytics:
  energy:
    update-interval: 300000
  anomaly:
    detection-interval: 600000
    threshold: 0.95
  behavior:
    analysis-interval: 3600000

logging:
  level:
    com.smarthome.analytics: DEBUG
    org.springframework.web: INFO