server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        - id: device-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/devices/**
          filters:
            - StripPrefix=0
        
        - id: scene-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/scenes/**
          filters:
            - StripPrefix=0
        
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
        
        - id: analytics-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=0

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO