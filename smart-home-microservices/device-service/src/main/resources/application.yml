server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: device-service
  
  cloud:
    config:
      enabled: false
  
  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:device_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Redis 缓存配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# 设备管理配置
device:
  heartbeat:
    interval: 30000  # 心跳间隔30秒
    timeout: 60000   # 超时时间60秒
  shadow:
    enabled: true    # 启用设备影子
  protocol:
    adapters:
      wifi:
        enabled: true
      bluetooth:
        enabled: true
      zigbee:
        enabled: true

# 日志配置
logging:
  level:
    com.smarthome.device: DEBUG
    org.springframework.web: INFO