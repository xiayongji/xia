server:
  port: 8081

spring:
  application:
    name: device-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    config:
      enabled: false

  # MySQL 数据库配置 (使用Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_device?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# 设备管理配置
analytics:
  service:
    url: http://localhost:8085

edge:
  service:
    url: http://localhost:8084

device:
  heartbeat:
    interval: 30000
    timeout: 60000
  shadow:
    enabled: true
  protocol:
    adapters:
      wifi:
        enabled: true
      bluetooth:
        enabled: true
      zigbee:
        enabled: true

logging:
  level:
    com.smarthome.device: DEBUG
    org.springframework.web: INFO