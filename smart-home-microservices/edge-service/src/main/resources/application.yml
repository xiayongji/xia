server:
  port: 8084

spring:
  application:
    name: edge-service
  http2:
    enabled: true
  
  # Redis 缓存配置
  data:
    redis:
      host: localhost
      port: 6379
      # password: your_redis_password  # 如果设置了密码取消注释
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # MySQL 数据库配置 (与 Docker MySQL 端口 5455 一致)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_edge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      # 连接池大小优化
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 连接测试
      connection-test-query: SELECT 1
      # 性能优化
      auto-commit: true
      pool-name: EdgeServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 性能优化
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # 二级缓存
        cache:
          use_second_level_cache: false
          use_query_cache: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

grpc:
  server:
    port: 9094

logging:
  level:
    com.smarthome.edge: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

edge:
  sync:
    frequency: 10000
  command:
    min-interval: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
