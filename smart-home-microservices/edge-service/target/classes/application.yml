server:
  port: 8084
  http2:
    enabled: true

spring:
  application:
    name: edge-service
  
  datasource:
    url: jdbc:h2:mem:edgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

grpc:
  server:
    port: 9090

logging:
  level:
    com.smarthome.edge: DEBUG
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

edge:
  sync:
    frequency: 10000
  command:
    min-interval: 50