server:
  port: 8086

spring:
  application:
    name: multimodal-service

  cloud:
    config:
      enabled: false

  # MySQL 数据库配置 (使用Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_multimodal?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis 缓存配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# 多模态交互配置
multimodal:
  intent:
    confidence-threshold: 0.7
    max-results: 5
  gesture:
    enabled: true
    detection-interval: 1000
  voice:
    enabled: true
    hotword: "小智小智"
  vision:
    enabled: true
    camera-id: 0
    detection-interval: 500

logging:
  level:
    com.smarthome.multimodal: DEBUG
    org.springframework.web: INFO