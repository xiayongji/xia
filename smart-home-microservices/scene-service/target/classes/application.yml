server:
  port: 8083

spring:
  application:
    name: scene-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    config:
      enabled: false

  # MySQL 数据库配置 (使用Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_scene?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# 场景控制配置
device:
  service:
    url: http://localhost:8081

scene:
  execution:
    async-enabled: true
    thread-pool-size: 10
  rules:
    engine: drools
    drools:
      rule-files:
        - rules/scene-rules.drl

logging:
  level:
    com.smarthome.scene: DEBUG
    org.springframework.web: INFO