server:
  port: 8082

spring:
  application:
    name: user-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    config:
      enabled: false

  # MySQL 数据库配置 (使用Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:5455/smarthome_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: infini_rag_flow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: SmartHomeSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongEnough
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.smarthome.user: DEBUG
    org.springframework.web: INFO