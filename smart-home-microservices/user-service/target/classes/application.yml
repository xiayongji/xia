server:
  port: 8083

spring:
  application:
    name: user-service
  
  cloud:
    config:
      enabled: false
  
  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3307/smarthome_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # Redis 缓存配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# JWT配置
jwt:
  secret: smart-home-jwt-secret-key-2024-must-be-at-least-32-bytes-long-for-hs256-algorithm
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# 安全配置
security:
  password:
    strength: 8  # 密码强度要求
  
# 日志配置
logging:
  level:
    com.smarthome.user: DEBUG
    com.smarthome.user.security: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO